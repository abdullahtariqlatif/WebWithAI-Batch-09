[project]
name = "real-estate-ai"
version = "0.1.0"
description = "AI real-estate assistant — FastAPI + LangChain/LangGraph backend, Streamlit frontend"
requires-python = ">=3.11"
dependencies = [
    # Web backend
    "fastapi[standard]>=0.115",
    "sqlmodel>=0.0.22",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    # LangChain ecosystem
    "langchain>=1.0",
    "langgraph>=1.0",
    "langchain-groq>=1.1.3",
    "langchain-openai>=1.0",
    "langchain-text-splitters>=1.0",
    # RAG: vector store + local Hugging Face embeddings (ONNX, no GPU/torch needed)
    "langchain-chroma>=1.1.0",
    "fastembed>=0.9.0",
    "trafilatura>=2.3.1",  # extracts article text from web pages
    # Observability
    "langsmith>=0.4",
    "langfuse>=3.0",
    # Frontend
    "streamlit>=1.40",
    "requests>=2.32",
]

[project.optional-dependencies]
# Install another LLM provider with e.g. `uv sync --extra anthropic`
anthropic = ["langchain-anthropic>=1.0"]
google = ["langchain-google-genai>=2.0"]
ollama = ["langchain-ollama>=1.0"]

[tool.uv]
package = false
